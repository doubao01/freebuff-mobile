# 版本号的唯一来源 —— 发版只改这一个文件。
#
# 派生关系:
#   versionName  -> app 的 BuildConfig.VERSION_NAME、core:model 的 LATEST_VERSION(构建时生成)
#   versionName  -> 发版标签必须一致(release.yml 硬校验,不一致直接失败)
#   versionCode  -> app 的 versionCode(每次发版必须递增)
#
# 校验脚本:scripts/update-manifest.py --check 会核对 dist/update.json 的版本不高于这里的 versionName。
versionCode=6
versionName=0.0.5
