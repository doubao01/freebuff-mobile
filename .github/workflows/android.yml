name: Android CI

# 只在 Android 工程或本工作流自身变化时运行 —— 纯文档改动不值得花一次
# 11 分钟的完整构建。注意 push 的 paths 过滤按「这次推上去的所有提交」合并求值:
# 只要其中任一提交改了 android/**, 就会触发; 只有整次推送都不涉及时才跳过。
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'dist/update.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'dist/update.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  # 允许在 Actions 页面手动触发(例如想重新产出 APK 制品时), 不受 paths 限制
  workflow_dispatch:

# 同一分支/PR 连续推送时, 取消还在跑的旧一轮, 避免排队叠加
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # runner 预装的 SDK 已含 platform-tools 与全部 licenses;老版参数请求的 legacy
      # "tools" 包已被 Google 下架(2026-09 起报 "Failed to find package 'tools'"),
      # 现在只需接受许可证 —— 真正缺的构建工具由 Gradle/AGP 自行下载。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # v5 = Node 24(消弭弃用告警);不升 v6:其缓存被抽为专有组件 gradle-actions-caching,
      # 升级即视为接受 Gradle 的 Terms of Use,对开源仓库不合适(v4 缓存仍是 MIT 行为)
      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v5

      # 版本清单守卫:dist/update.json 的版本不得高于 android/version.properties 的产品版本
      # (高于 = 所有用户都会看到一个永远装不上的「新版本」);发版工作流会用同一脚本重建它。
      - name: Check update manifest (dist/update.json)
        run: python3 ../scripts/update-manifest.py --check

      # --stacktrace:失败时直接给出仓库/依赖级别的真实原因, 不用再补一次只能看个结论的构建
      - name: Unit tests (pure JVM + MockWebServer)
        run: ./gradlew :core:model:test :core:data:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
